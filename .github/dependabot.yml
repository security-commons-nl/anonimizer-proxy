version: 2
updates:
  - package-ecosystem: "npm"
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Wacht op de migratie naar vitest 4. @cloudflare/vitest-pool-workers 0.21 eist vitest ^4.1
      # en heeft fetchMock uit "cloudflare:test" gehaald; de testsuite leunt daarop.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@cloudflare/vitest-pool-workers"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 14
      semver-patch-days: 7

  - package-ecosystem: "github-actions"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
    labels:
      - "dependencies"
      - "ci"
