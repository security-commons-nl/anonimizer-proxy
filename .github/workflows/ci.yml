name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      # npm ci volgt de lockfile exact. Met npm install lost npm de versies opnieuw op en
      # kan een nieuwe peer-eis van een dependency de build breken zonder dat hier iets wijzigde.
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
